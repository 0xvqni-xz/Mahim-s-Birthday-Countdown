<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mahim's Birthday Countdown 🎂</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
min-height:100vh;
overflow-x:hidden;
background:linear-gradient(-45deg,#ff0080,#7928ca,#007cf0,#00dfd8);
background-size:400% 400%;
animation:bgMove 15s ease infinite;
color:white;
text-align:center;
}

@keyframes bgMove{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.hero{
padding-top:80px;
animation:fadeIn 2s ease;
}

.hero h1{
font-size:4rem;
text-shadow:0 0 20px rgba(255,255,255,.5);
}

.hero p{
font-size:1.2rem;
margin-top:10px;
}

.countdown{
display:flex;
justify-content:center;
gap:20px;
flex-wrap:wrap;
margin-top:50px;
}

.box{
width:130px;
padding:25px;
border-radius:20px;
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
box-shadow:0 8px 30px rgba(0,0,0,.2);
transition:.4s;
}

.box:hover{
transform:translateY(-10px) scale(1.05);
}

.box h2{
font-size:2.5rem;
}

.box span{
font-size:1rem;
}

.gallery{
margin-top:80px;
padding:20px;
}

.gallery h2{
margin-bottom:20px;
}

.photos{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:20px;
}

.photo{
width:250px;
height:180px;
border:3px dashed rgba(255,255,255,.7);
border-radius:20px;
display:flex;
align-items:center;
justify-content:center;
font-size:1rem;
background:rgba(255,255,255,.1);
transition:.4s;
}

.photo:hover{
transform:scale(1.05);
}

.floating{
position:absolute;
bottom:-100px;
font-size:2rem;
animation:floatUp linear infinite;
opacity:.8;
}

@keyframes floatUp{
0%{
transform:translateY(0) rotate(0deg);
}
100%{
transform:translateY(-120vh) rotate(360deg);
}
}

@keyframes fadeIn{
from{
opacity:0;
transform:translateY(40px);
}
to{
opacity:1;
transform:translateY(0);
}
}

#celebration{
display:none;
font-size:3rem;
margin-top:40px;
animation:pulse 1s infinite;
}

@keyframes pulse{
50%{
transform:scale(1.1);
}
}

.music-btn{
margin-top:30px;
padding:12px 25px;
border:none;
border-radius:30px;
font-size:1rem;
cursor:pointer;
background:white;
color:black;
font-weight:bold;
transition:.3s;
}

.music-btn:hover{
transform:scale(1.08);
}

footer{
margin:50px 0;
font-size:.9rem;
opacity:.8;
}
</style>
</head>
<body>

<div class="hero">
<h1>🎂 Mahim 🎂</h1>
<p>Birthday Countdown to 25 June</p>

<button class="music-btn" onclick="toggleMusic()">
🎵 Play Music
</button>

<div class="countdown">
<div class="box">
<h2 id="days">0</h2>
<span>Days</span>
</div>

<div class="box">
<h2 id="hours">0</h2>
<span>Hours</span>
</div>

<div class="box">
<h2 id="minutes">0</h2>
<span>Minutes</span>
</div>

<div class="box">
<h2 id="seconds">0</h2>
<span>Seconds</span>
</div>
</div>

<div id="celebration">
🎉 HAPPY BIRTHDAY MAHIM 🎉
</div>
</div>

<div class="gallery">
<h2>📸 Memories Gallery</h2>

<div class="photos">
<div class="photo">Add photo1.jpg</div>
<div class="photo">Add photo2.jpg</div>
<div class="photo">Add photo3.jpg</div>
</div>
</div>

<footer>
Made with ❤️ for Mahim
</footer>

<audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

<script>
const birthday = new Date("June 25, 2026 00:00:00").getTime();

const timer = setInterval(() => {

const now = new Date().getTime();
const distance = birthday - now;

if(distance <= 0){

clearInterval(timer);

document.querySelector(".countdown").style.display="none";
document.getElementById("celebration").style.display="block";

launchConfetti();
return;
}

document.getElementById("days").innerHTML =
Math.floor(distance/(1000*60*60*24));

document.getElementById("hours").innerHTML =
Math.floor((distance%(1000*60*60*24))/(1000*60*60));

document.getElementById("minutes").innerHTML =
Math.floor((distance%(1000*60*60))/(1000*60));

document.getElementById("seconds").innerHTML =
Math.floor((distance%(1000*60))/1000);

},1000);

function toggleMusic(){
const music=document.getElementById("bgMusic");

if(music.paused){
music.play();
}
else{
music.pause();
}
}

function createBalloon(){
const balloon=document.createElement("div");

balloon.classList.add("floating");

const emojis=["🎈","🎉","🎂","✨","🎊"];

balloon.innerHTML=
emojis[Math.floor(Math.random()*emojis.length)];

balloon.style.left=Math.random()*100+"vw";
balloon.style.animationDuration=
(Math.random()*5+5)+"s";

document.body.appendChild(balloon);

setTimeout(()=>{
balloon.remove();
},10000);
}

setInterval(createBalloon,700);

function launchConfetti(){
for(let i=0;i<200;i++){
setTimeout(createBalloon,i*20);
}
}
</script>

</body>
</html>
